SecRule REQUEST_URI "@beginsWith /search" "id:1000500,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-sqli"
# Hassas dosya uzantilarina (.env, .sql, .ini vb.) erisimi engeller
SecRule REQUEST_FILENAME "\.(?:bak|config|sql|env|ini|log|git)$" "id:2000001,phase:1,deny,status:403,log,msg:'Hassas dosya tespiti'"

# GET, POST ve HEAD disindaki (PUT, DELETE vb.) tum HTTP metodlarini engeller
SecRule REQUEST_METHOD "!^(?:GET|POST|HEAD)$" "id:2000002,phase:1,deny,status:405,log,msg:'Gecersiz metod'"

# Bilinen saldiri araclarinin (sqlmap, nmap vb.) tarama yapmasini engeller
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nmap shellshock burp" "id:2000003,phase:1,deny,status:403,log,msg:'Saldiri botu engellendi'"

# Dosya yukleme alanlarinda script calistirilabilecek tehlikeli uzantilari engeller
SecRule FILES "\.(?:php|phtml|php3|php4|php5|phps|exe|sh|bin|pl)$" "id:2000004,phase:2,deny,status:403,log,msg:'Tehlikeli dosya yukleme'"

# Shell komutu calistirma girisimlerini (ls, cat, /etc/passwd vb.) basitce yakalar
SecRule ARGS|ARGS_NAMES "@pm /etc/passwd /bin/sh /bin/bash /windows/system32" "id:2000005,phase:2,deny,status:403,log,msg:'OS Command Injection tespiti'"

# Sayfa icinde XSS riskine karsi <script> ve benzeri HTML etiketlerini kontrol eder
SecRule ARGS "@rx <script|alert\(|onerror=" "id:2000006,phase:2,deny,status:403,log,msg:'XSS tespiti'"