<app-floating-configurator />
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <i class="pi pi-shield text-primary" style="font-size: 4rem;"></i>
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-2 mt-4">HAProxy Yonetim Paneli</div>
                    <span class="text-muted-color font-medium">Devam etmek icin giris yapin</span>
                </div>
                @if (errorMsg()) {
                    <p-message severity="error" [text]="errorMsg()" styleClass="mb-4 w-full" />
                }
                <div>
                    <label for="email1" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">E-posta</label>
                    <input pInputText id="email1" type="text" placeholder="E-posta adresi" class="w-full md:w-120 mb-8" [(ngModel)]="email" (keyup.enter)="login()" />

                    <label for="password1" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Sifre</label>
                    <p-password id="password1" [(ngModel)]="password" placeholder="Sifre" [toggleMask]="true" styleClass="mb-8" [fluid]="true" [feedback]="false" (keyup.enter)="login()"></p-password>

                    <p-button label="Giris Yap" [loading]="loading()" styleClass="w-full" (onClick)="login()"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
